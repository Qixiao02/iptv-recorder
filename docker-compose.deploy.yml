# IPTV Recorder —— 服务器部署专用 compose(无需源码,使用预构建镜像)
#
# 与 docker-compose.yml 的区别:
#   - 只有 image:,无 build: —— 绝不触发本地构建,纯靠 docker load 加载的镜像
#   - 数据卷用绝对路径 ./data(不依赖源码目录结构)
#   - 以 root 运行 + 挂载宿主机存储卷,可直接录制到 NAS 任意目录
#     (镜像本身以非 root 设计;此 compose 为 NAS 部署便利放开权限,
#      安全边界低于源码版,适合可信内网 NAS)
#
# 部署步骤:
#   1) 把这三个文件传到服务器同一目录:
#        - iptv-recorder-0.1.7.tar          (镜像)
#        - iptv-recorder-0.1.7.tar.sha256   (校验和,可选)
#        - docker-compose.deploy.yml        (本文件)
#   2) 在服务器上:
#        docker load -i iptv-recorder-0.1.7.tar
#        # (可选)校验完整性:
#        sha256sum -c iptv-recorder-0.1.7.tar.sha256
#
#   3) 生成 .env(密钥 + 初始密码):
#        echo "IPTV_JWT_SECRET=$(openssl rand -hex 32)" > .env
#        echo "IPTV_INITIAL_ADMIN_PASSWORD=你的强密码" >> .env
#
#   4) 启动:
#        docker compose -f docker-compose.deploy.yml up -d
#
#   5) 访问 http://<服务器IP>:5669,用 .env 里的初始密码登录 admin
#
# 录制到 NAS 指定目录:
#   本 compose 以 root 运行,但挂载收紧为只挂存储卷(不挂整个根 / ),
#   避免暴露 /etc /root /var 等系统敏感目录。
#   飞牛(fnOS)存储池一般在 /vol00 /vol01 ...(NAS 上 `ls -d /vol*` 确认),
#   已映射到容器内 /mnt/host/vol00 等。在 Web UI「设置 > 存储」点「选择目录」,
#   从 /mnt/host 开始浏览,选中想要的目录后保存即可。
#   因容器 root 身份,可读写已挂载的存储卷,无需额外 chmod。
#   【加盘】若要新增存储卷,在下方 volumes 增一行 `- /你的路径:/mnt/host/你的路径`。
#
# 升级到新版本:
#   - 传新版本 tar(如 iptv-recorder-0.1.8.tar)
#   - docker load -i iptv-recorder-0.1.8.tar
#   - 改本文件的 image: tag 为 0.1.8
#   - docker compose -f docker-compose.deploy.yml up -d   (自动重建容器,数据保留)

services:
  iptv-recorder:
    image: iptv-recorder:0.1.7
    container_name: iptv-recorder
    restart: unless-stopped
    # 以 root 运行:让容器能直接读写宿主机挂载进来的存储卷(NAS 部署便利)。
    # 镜像内默认是非 root app 用户;此覆盖放开权限,等同飞牛/群晖上多数自部署应用。
    user: "0:0"
    env_file:
      - path: .env
        required: false
    ports:
      - "5669:3000"
    environment:
      RUST_LOG: info
      IPTV__SERVER__HOST: 0.0.0.0
      IPTV__SERVER__PORT: 3000
      IPTV__DATABASE__PATH: /app/data/iptv-recorder.db
      IPTV__STORAGE__RECORDINGS_DIR: /app/data/recordings
      IPTV__STORAGE__TEMP_DIR: /app/data/.tmp
      IPTV__STORAGE__PREVIEW_TEMP_DIR: /dev/shm/iptv-recorder-hls
      IPTV__RECORDER__EXECUTABLE: N_m3u8DL-RE
      IPTV__RECORDER__POST_PROCESS__FFMPEG_PATH: ffmpeg
      # IPTV_JWT_SECRET 与 IPTV_INITIAL_ADMIN_PASSWORD 由 .env 提供,不在此硬编码
    volumes:
      # 数据持久化:数据库 + 默认录制目录 + 临时目录。重建容器不丢数据。
      - ./data:/app/data
      # ──────────────────────────────────────────────────────────────
      # 宿主机存储卷映射:让 Web UI「设置 > 存储」能浏览并选择宿主机路径。
      # 容器以 root 运行,可读写任意已挂载目录,无需额外 chmod。
      #
      # 【收紧挂载】只挂存储卷,不挂整个根 / ——避免暴露 /etc /root /var 等敏感目录。
      # 飞牛(fnOS)存储池一般在 /vol*(用 `ls -d /vol*` 在 NAS 上确认实际有哪些),
      # 按实际情况取消注释 / 增删。映射后容器内路径为 /mnt/host/<同名>。
      # 例:宿主 /vol00 → 容器 /mnt/host/vol00,Web UI 选目录时看到的就是这个路径。
      - /vol00:/mnt/host/vol00
      # - /vol01:/mnt/host/vol01
      # - /vol02:/mnt/host/vol02
      # 若你的盘在别的位置(群晖常在 /volume*、自定义挂载点),改成对应路径,如:
      # - /volume1:/mnt/host/volume1
      # - /mnt/sata1:/mnt/host/sata1
      # ──────────────────────────────────────────────────────────────
    networks:
      - iptv-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  iptv-net:
    driver: bridge
