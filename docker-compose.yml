# IPTV Recorder —— 本地开发 + 单镜像部署编排(含 build)
#
# ⚠️ 本文件用途:本地开发 / 自行从源码构建镜像。需要完整源码 + Docker build。
#    ★ 部署到 NAS/Linux 服务器请用 docker-compose.deploy.yml(纯镜像,无需源码,带 PUID/PGID)。
#
# 架构:前端构建产物已打包进后端镜像(见 Dockerfile),单容器同时提供
#      React Web UI + REST API + WebSocket,统一监听 :3000(宿主映射 :5133)。
#      无需单独的前端容器。
#
# 权限说明:本文件不设 user,走镜像默认(开发机通常无权限问题)。
#          NAS/生产环境遇到权限问题(SQLite code 14)请改用 deploy 版 + PUID/PGID。
#
# 首次部署:
#   1) bash scripts/generate-env.sh        # 生成 .env (JWT 密钥 + 初始密码, 必做)
#   2) docker compose up -d --build        # 构建并启动(镜像打 tag: iptv-recorder:<版本>)
#   3) 浏览器访问 http://localhost:5133
#
# 导出镜像(分发/备份):
#   docker save iptv-recorder:0.1.7 -o iptv-recorder-0.1.7.tar
#
# 在另一台机器加载镜像并启动(无需源码,用 deploy 版 compose):
#   docker load -i iptv-recorder-0.1.7.tar
#   docker compose -f docker-compose.deploy.yml up -d

services:
  iptv-recorder:
    # 镜像 tag:与 build 同时指定时,构建产物会打上此 tag;不构建时(docker compose pull)
    # 也用此 tag 拉取。版本号变更时同步更新此处(及 Cargo.toml / package.json / i18n)。
    image: iptv-recorder:0.1.7
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iptv-recorder
    restart: unless-stopped
    # 密钥与初始密码从 .env 读取(首次运行前用 scripts/generate-env 生成)
    env_file:
      - path: .env
        required: false
    ports:
      - "5133:3000"
    environment:
      RUST_LOG: info
      IPTV__SERVER__HOST: 0.0.0.0
      IPTV__SERVER__PORT: 3000
      IPTV__DATABASE__PATH: /app/data/iptv-recorder.db
      IPTV__STORAGE__RECORDINGS_DIR: /app/data/recordings
      IPTV__STORAGE__TEMP_DIR: /app/data/.tmp
      IPTV__STORAGE__PREVIEW_TEMP_DIR: /dev/shm/iptv-recorder-hls
      IPTV__RECORDER__EXECUTABLE: N_m3u8DL-RE
      IPTV__RECORDER__POST_PROCESS__FFMPEG_PATH: ffmpeg
      # IPTV_JWT_SECRET 与 IPTV_INITIAL_ADMIN_PASSWORD 由 .env 提供,不在此硬编码
    security_opt:
      - no-new-privileges:true
    # PUID/PGID 方案需要 root 启动 + entrypoint 用 su-exec 切换用户,
    # 这需要 SETUID/SETGID capability。不能 cap_drop: ALL(会删掉这两个)。
    # 保留 SETUID/SETGID,丢弃其他所有危险的 capability。
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN        # entrypoint 的 chown /app 需要
      - FOWNER       # chown 改属主需要
    volumes:
      - ./backend/data:/app/data
      # ──────────────────────────────────────────────────────────────
      # 宿主机路径映射:把宿主机文件系统挂进容器,让 Web UI 能浏览并选择宿主机路径。
      #
      # 【Windows Docker Desktop】(需在 Settings→Resources→File Sharing 启用对应盘符):
      #   整盘挂载,左侧用 /<盘符>/ 形式(Docker Desktop 会自动映射到宿主盘符)
      - /d:/mnt/host/d
      - /c:/mnt/host/c
      #
      # 【Linux 宿主机】:把上面两行注释掉,改为下方之一:
      #   - /:/mnt/host                  # 挂载整个根目录(可访问任意宿主路径,安全边界较低)
      #   或按需按盘/目录挂载:
      #   - /home:/mnt/host/home
      #   - /mnt/nas:/mnt/host/nas       # 网络盘先在宿主机挂载,再映射进容器
      #
      # 挂载后,在 Web UI「设置 > 存储」点"选择目录",从 /mnt/host 开始浏览即可选到宿主机路径。
      # ──────────────────────────────────────────────────────────────
    networks:
      - iptv-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  iptv-net:
    driver: bridge
