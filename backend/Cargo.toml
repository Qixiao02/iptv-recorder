[package]
name = "iptv-recorder"
version = "0.1.8"
edition = "2021"
authors = ["IPTV Recorder Team"]
description = "IPTV M3U management and scheduled recording system"

[[bin]]
name = "iptv-recorder"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-br", "compression-gzip", "compression-deflate", "set-header"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = "0.1"

# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# Template engine
askama = { version = "0.12", features = ["with-axum"] }
# 暂时使用 askama 0.12 以兼容 askama_axum

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
figment = { version = "0.10", features = ["env", "toml", "yaml"] }

# Scheduler
tokio-cron-scheduler = "0.12"
cron = "0.12"

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies", "socks", "stream"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Time & Date
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Authentication
bcrypt = "0.16"
# jsonwebtoken 10.x 需显式启用 crypto provider(rust_crypto),否则启动报错
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# Utilities
regex = "1.11"
url = "2.5"
shellexpand = "3.1"
quick-xml = { version = "0.38", features = ["serialize"] }

[dev-dependencies]
http-body-util = "0.1"
